source = ~/.config/hypr/sshagent.conf

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = hypridle &
exec-once = hyprpaper &
exec-once = dunst &
exec-once = killall pipewire
exec-once = pipewire
exec-once = udiskie --terminal=yazi -s &
exec-once = hyprctl setcursor Adwaita 24
exec-once = hyprpm reload -nn
exec-once = ~/.config/hypr/start_waybar.sh &

#                      _         _      _
#                     (_)       | |    | |
# __   __  __ _  _ __  _   __ _ | |__  | |  ___  ___
# \ \ / / / _` || '__|| | / _` || '_ \ | | / _ \/ __|
#  \ V / | (_| || |   | || (_| || |_) || ||  __/\__ \
#   \_/   \__,_||_|   |_| \__,_||_.__/ |_| \___||___/

$terminal = alacritty
$menu = $HOME/.config/rofi/launcher.sh
$editor = hx
$file_manager = yazi

#   ___  _ __  __   __
#  / _ \| '_ \ \ \ / /
# |  __/| | | | \ V /
#  \___||_| |_|  \_/

#env = QT_QPA_PLATFORMTHEME,qt5ct
env = HYPRCURSOR_SIZE,16
env = XCURSOR_SIZE,16
env = XCURSOR_THEME,Adwaita
env = HYPRCURSOR_THEME,Adwaita
#env = MOZ_WEBRENDER,0
monitor =,1920x1080,auto,1

#  _                       _
# (_)                     | |
#  _  _ __   _ __   _   _ | |_
# | || '_ \ | '_ \ | | | || __|
# | || | | || |_) || |_| || |_
# |_||_| |_|| .__/  \__,_| \__|
#           | |
#           |_|

input {
    kb_layout = us,ru
    kb_options = grp:win_space_toggle
    kb_rules =

    follow_mouse = 1

    touchpad {
        natural_scroll = true
        scroll_factor = 0.7
        disable_while_typing = false
        clickfinger_behavior = true
        tap-to-click = true
        drag_lock = true
    }

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

gestures {
    workspace_swipe = on
    workspace_swipe_fingers = 3
    workspace_swipe_min_speed_to_force = 15
    workspace_swipe_distance = 300
    workspace_swipe_cancel_ratio = 0.3
}

#                                         _
#                                        | |
#   __ _   ___  _ __    ___  _ __   __ _ | |
#  / _` | / _ \| '_ \  / _ \| '__| / _` || |
# | (_| ||  __/| | | ||  __/| |   | (_| || |
#  \__, | \___||_| |_| \___||_|    \__,_||_|
#   __/ |
#  |___/

general {
    gaps_in = 6
    gaps_out = 10
    border_size = 2

    col.active_border = rgb(EAECEF)
    col.inactive_border = rgb(484848)
    resize_on_border = true
    extend_border_grab_area = 20
    no_border_on_floating = false

    layout = dwindle
    allow_tearing = false
}

decoration {
    rounding = 0

    blur {
        enabled = false
    }

    shadow {
        enabled = false        
    }

    active_opacity = 1    
    dim_special = 0.4
    dim_inactive = false
    dim_strength = 0.1
}

#                _                    _    _
#               (_)                  | |  (_)
#   __ _  _ __   _  _ __ ___    __ _ | |_  _   ___   _ __   ___
#  / _` || '_ \ | || '_ ` _ \  / _` || __|| | / _ \ | '_ \ / __|
# | (_| || | | || || | | | | || (_| || |_ | || (_) || | | |\__ \
#  \__,_||_| |_||_||_| |_| |_| \__,_| \__||_| \___/ |_| |_||___/

animations {
    enabled = true
    
    bezier = windowOpen, 0, 1.2, 0.5, 1.0

    animation = windows, 1, 4, windowOpen
    animation = windowsOut, 1, 7, default, popin 60%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 5, default
}

dwindle {
    pseudotile = false # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # you probably want this
}

master {
}

#             _
#            (_)
#  _ __ ___   _  ___   ___
# | '_ ` _ \ | |/ __| / __|
# | | | | | || |\__ \| (__
# |_| |_| |_||_||___/ \___|

misc {
    animate_manual_resizes = true
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vfr = true

    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    force_default_wallpaper = 0 # Set to 0 to disable the anime mascot wallpapers
}

plugin {
    hyprbars {
        bar_height = 20
        bar_color = rgb(484848)
        bar.text_size = 15
        bar_text_align = left
        bar_text_font = Iosevka Nerd Font
    }
}

#               _
#              | |
#  _ __  _   _ | |  ___  ___
# | '__|| | | || | / _ \/ __|
# | |   | |_| || ||  __/\__ \
# |_|    \__,_||_| \___||___/

windowrule = nomaxsize, class:.* # You'll probably like this.
windowrule = idleinhibit focus, class:^(librewolf)$
windowrule = plugin:hyprbars:bar_color rgb(EAECEF), focus:1
windowrule = plugin:hyprbars:title_color rgb(000000), focus:1

windowrule = center, title:^(Save Image)$,class:^(librewolf)$
windowrule = center, title:^(Enter name of file to save to…)$,class:^(librewolf)$
windowrule = center, title:^(Choose Directory)$
windowrule = center, title:^(Volume Control)$
windowrule = center, title:^(Open Folder)$
windowrule = center, title:^(Open File)$
windowrule = center, title:Open with.*

# ueberzug rules
windowrule = noanim, class:ueberzugpp.*
windowrule = move 0 100%, class:ueberzugpp.*
windowrule = plugin:hyprbars:nobar, class:ueberzugpp.*

windowrule = size 760 840, title:^(- Properties)$
windowrule = size 840 640, title:^Save.* class:^(librewolf)$
windowrule = size 840 640, title:^Open.* class:^(librewolf)$
windowrule = plugin:hyprbars:nobar, onworkspace:w[tv1], class:^(librewolf)$
windowrule = plugin:hyprbars:nobar, onworkspace:f[1], class:^(librewolf)$
windowrule = bordersize 0, floating:0, onworkspace:w[tv1], class:^(librewolf)$
windowrule = bordersize 0, floating:0, onworkspace:f[1], class:^(librewolf)$

# "Smart gaps" / "No gaps when only"
workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0
windowrule = rounding 0, floating:0, onworkspace:w[tv1]
windowrule = rounding 0, floating:0, onworkspace:f[1]

#  _      _             _
# | |    (_)           | |
# | |__   _  _ __    __| | ___
# | '_ \ | || '_ \  / _` |/ __|
# | |_) || || | | || (_| |\__ \
# |_.__/ |_||_| |_| \__,_||___/

$mainMod = SUPER

bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, V, togglefloating,
bind = $mainMod, J, togglesplit,
bind = $mainMod, R, exec, $menu
bind = $mainMod, L, exec, ~/.config/rofi/powermenu.sh
bind = $mainMod, F, fullscreen
bind = $mainMod, P, exec, hyprpicker -an

#Screenshots
$screenshotDir = ~/Pictures/Screenshots/
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy -t image/png && wl-paste > $screenshotDir$(date +'screenshot_%Y-%m-%d-%H%M%S.png') && notify-send -t 1000 "Screenshot" "Area Screenshot taken"
bind = CTRL, Print, exec, grim - | wl-copy -t image/png && wl-paste > $screenshotDir$(date +'screenshot_%Y-%m-%d-%H%M%S.png') && notify-send -t 1000 "Screenshot" "Full Screenshot taken"
# upower -i /org/freedesktop/UPower/devices/battery_BAT0 | grep percentage | grep -o "[0-9]*"

# Special keys
bind = , xf86monbrightnessup, exec, brightnessctl set 10%+
bind = , xf86monbrightnessdown, exec, brightnessctl set 10%-
bind = , xf86audioraisevolume, exec, wpctl set-volume -l 1.0 @DEFAULT_SINK@ 5%+
bind = , xf86audiolowervolume, exec, wpctl set-volume -l 1.0 @DEFAULT_SINK@ 5%-
bind = , xf86audiomute, exec, wpctl set-mute @DEFAULT_SINK@ toggle
bind = , xf86audiomicmute, exec, wpctl set-mute @DEFAULT_SOURCE@ toggle

# Move windows
bind = $mainMod SHIFT, left, swapwindow, l
bind = $mainMod SHIFT, right, swapwindow, r
bind = $mainMod SHIFT, up, swapwindow, u
bind = $mainMod SHIFT, down, swapwindow, d

# Move window focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Resize windows
bind = $mainMod CTRL, left, resizeactive,  -60 0
bind = $mainMod CTRL, right, resizeactive,  60 0
bind = $mainMod CTRL, up, resizeactive,     0 -60
bind = $mainMod CTRL, down, resizeactive,   0 60

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
