general {
    lock_cmd = pidof hyprlock || (hyprlock && sleep 1)
    before_sleep_cmd = loginctl lock-session && playerctl pause && sleep 1
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 180
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

listener { 
    timeout = 180                                          
    on-timeout = brightnessctl -sd tpacpi::kbd_backlight set 0
    on-resume = brightnessctl -rd tpacpi::kbd_backlight
}

listener {
    timeout = 240
    on-timeout = loginctl lock-session
}

listener {
    timeout = 300
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on && pidof hypridle
}

listener {
    timeout = 420
    on-timeout = loginctl suspend
}
