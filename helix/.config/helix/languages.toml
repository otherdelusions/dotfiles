[[language]]
name = "go"
auto-format = true
formatter = ["gofumpt"]

[language-server.golangci-lint-lsp.config]
command = [
  "golangci-lint",
  "run",
  "--output.json.path",
  "stdout",
  "--show-stats=false",
  "--issues-exit-code=1",
]

# [language-server.sql-language-server]
# command = "sql-language-server"
# args = ["up", "--method", "stdio"]

# [[language]]
# name = "sql"
# language-servers = ["sql-language-server"]

[[language]]
name = "bash"
indent = { tab-width = 4, unit = "    " }
formatter = { command = 'shfmt', args = ["-i", "4"] }
auto-format = true

[[language]]
name = "toml"
auto-format = true
formatter = { command = "taplo", args = ["fmt", "-"] }

[language-server.mdpls]
command = "mdpls"

[[language]]
name = "markdown"
language-servers = ["mdpls", "marksman", "markdown-oxide"]
auto-format = true
formatter = { command = 'prettier', args = ["--parser", "markdown"] }

[[language]]
name = "yaml"
formatter = { command = 'prettier', args = ["--parser", "yaml"] }
auto-format = true

[[language]]
name = "html"
formatter = { command = 'prettier', args = ["--parser", "html"] }

[[language]]
name = "css"
formatter = { command = 'prettier', args = ["--parser", "css"] }

[[language]]
name = "json"
formatter = { command = 'prettier', args = [
  "--trailing-comma",
  "none",
  "--parser",
  "json",
] }
auto-format = true

[[language]]
name = "jsonc"
formatter = { command = 'prettier', args = [
  "--trailing-comma",
  "none",
  "--parser",
  "jsonc",
] }
auto-format = true

