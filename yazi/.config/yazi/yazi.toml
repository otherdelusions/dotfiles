[manager]
show_hidden = true
ratio = [2, 5, 6]
sort_by = "natural"
scrolloff = 8

[preview]
image_delay = 60
ueberzug_offset = [1, 1, 0, 0]

[opener]
edit = [
  { run = '${EDITOR:-hx} "$@"', desc = "Edit", block = true },
  { run = 'sudo -E ${EDITOR:-hx} "$@"', desc = "Edit with root", block = true },
]

open = [{ run = 'xdg-open "$1"', orphan = true, desc = "Open" }]

exif = [
  { run = '''exiftool "$1"; echo "Press enter to exit"; read _''', block = true, desc = "Show EXIF" },
]

extract = [{ run = 'ya pub extract --list "$@"', desc = "Extract here" }]

play = [
  { run = 'mpv "$@"', orphan = true },
  { run = '''mediainfo "$1"; echo "Press enter to exit"; read _''', block = true, desc = "Show media info" },
]

[open]
prepend_rules = [
  { mime = "text/*", use = [
    "edit",
    "open",
    "exif",
  ] },
  { mime = "image/*", use = [
    "open",
    "exif",
  ] },
  { mime = "inode/directory", use = [
    "edit",
  ] },
]
