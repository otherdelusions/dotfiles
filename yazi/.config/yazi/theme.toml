[mgr]
hovered = { reversed = true }
preview_hovered = { reversed = true }

find_keyword = { bg = "#525252", fg = "white", italic = true }

tab_active = { reversed = true }
tab_inactive = {}
tab_width = 1

count_copied = { fg = "black", bg = "green" }
count_cut = { fg = "black", bg = "red" }
count_selected = { fg = "black", bg = "yellow" }

border_symbol = "│"
border_style = { bg = "reset", fg = "darkgray" }

syntect_theme = "~/.config/yazi/carbonfox.tmTheme"

[mode]
normal_main = { fg = "#161616", bg = "blue", bold = true }
normal_alt = { fg = "#b6b8bb", bg = "#0C0C0C" }
select_main = { fg = "#161616", bg = "green", bold = true }
select_alt = { fg = "#b6b8bb", bg = "#0C0C0C" }
unset_main = { fg = "#161616", bg = "magenta", bold = true }
unset_alt = { fg = "#b6b8bb", bg = "#0C0C0C" }

[status]
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }

overall = { fg = "#b6b8bb", bg = "#0C0C0C" }

progress_label = { fg = "#161616", bg = "gray", bold = false }
progress_normal = { fg = "#161616", bg = "yellow", bold = false }
progress_error = { fg = "#161616", bg = "red", bold = false }

perm_type = { fg = "lightblue" }
perm_read = { fg = "magenta" }
perm_write = { fg = "blue" }
perm_exec = { fg = "magenta" }
perm_sep = { fg = "darkgray" }

[tasks]
border = { fg = "white" }

[input]
border = { fg = "white" }

[pick]
border = { fg = "white" }

[filetype]
rules = [
  { mime = "image/*", fg = "magenta" },
  { mime = "{audio,video}/*", fg = "yellow" },
  { mime = "application/{,g}zip", fg = "cyan" },
  { mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", fg = "cyan" },
  { mime = "application/{pdf,doc,rtf,vnd.*}", fg = "lightred" },
  { name = "*", is = "orphan", fg = "white" },
  { name = "*", is = "exec", fg = "magenta", dim = true },
  { name = "*/", fg = "blue" },
]
